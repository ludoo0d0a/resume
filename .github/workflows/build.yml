name: Build and deploy resume

on:
  push:
    paths:
      - 'resume.i18n.json'
      - 'scripts/**'
      - 'templates/**'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'schemas/europass/**'
      - '.github/workflows/build.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RESUME_PUPPETEER_NO_SANDBOX: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install resume-cli
        run: npm install -g resume-cli

      - name: Install project dependencies
        run: npm ci

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Split i18n source
        run: npm run split

      - name: Commit per-language JSON (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add resume.en.json resume.fr.json
          git commit -m "chore: update language-specific resume files" || exit 0
          git push

      - name: Update Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        if: ${{ env.GIST_ID != '' }}
        run: gh gist edit $GIST_ID -f resume.json resume.en.json

      - name: Build public site
        run: npm run build -- --preset public

      - name: Commit generated site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f public/ pdf/
          git commit -m "chore: generated site in public/ and pdf/" || exit 0
          git push

      - name: Remove node_modules before Pages deploy
        run: rm -rf node_modules

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages

      - name: Log deploy URL
        run: |
          echo "::notice::Site https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
