name: Translate resume files

on:
  push:
    paths:
      - 'resume.i18n.json'
      - 'scripts/**'
      - 'europass/**'
      - 'index.js'
      - 'package.json'
      - 'schemas/europass/**'
      - '.github/workflows/split-i18n.yml'

  workflow_dispatch:

jobs:
  generate-resume:
    runs-on: ubuntu-latest
    env:
      RESUME_PUPPETEER_NO_SANDBOX: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Translate resume files
        run: node .github/scripts/split-languages.cjs --action=split

      - name: Commit Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add resume.en.json resume.fr.json
          git commit -m "chore: update language-specific resume files" || exit 0
          git push

      # Update gist resume.json : https://gist.github.com/ludoo0d0a/b7e4355cd0d2722f25002eca525ea262
      # to see changes into jsonresume.org website : https://registry.jsonresume.org/ludoo0d0a
      - name: Update Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        if: ${{ env.GIST_ID != '' }}
        run: gh gist edit $GIST_ID -f resume.json resume.en.json

      - name: Install resume-cli
        run: npm install -g resume-cli

      - name: Install project dependencies
        run: npm ci

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Build site and Europass outputs
        run: |
          npm run build:site
          npm run build:europass
          npm run validate

      - name: Commit generated files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/ pdf/
          git commit -m "chore: generated site files in public/ and pdf/" || exit 0
          git push

      - name: Remove node_modules before Pages deploy
        run: rm -rf node_modules

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages

      - name: Log Deploy URL
        run: |
          echo "::notice::Resume deployed to https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "::notice::Europass EN https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/resume.en.europass.html"
